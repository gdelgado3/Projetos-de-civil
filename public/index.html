.carga { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; text-align: center; color: #fff; font-family: "Bricolage Grotesque", system-ui, sans-serif;
  background: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 34px 34px, linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 34px 34px,

.carga .miolo { display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(92vw, 560px) }
.carga .marca { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 20px; margin-bottom: 4px }
.carga .selo { width: 36px; height: 36px; border-radius: 11px; background: #F5A20A; display: grid; place-items: center }
.carga .selo i { display: block; width: 18px; height: 3px; border-radius: 2px; background: #0B1F3F; box-shadow: 0 6px 0 #0B1F3F, 0 -6px 0 rgba(11,31,63,.5) }
.cena { width: 100%; height: auto; overflow: visible }
.cena .tro { animation: k-tro 3.2s infinite ease-in-out }
.cena .cabo { transform-origin: 170px 46px; animation: k-cabo 3.2s infinite ease-in-out }
.cena .hang { animation: k-hang 3.2s infinite ease-in-out }
.cena .mod { animation: k-mod 3.2s infinite linear }
.cena .modf { opacity: 0; animation: k-modf 3.2s infinite linear }
.cena .pc { opacity: 0; animation-duration: 3.2s; animation-iteration-count: infinite; animation-timing-function: ease-out }
.carga .frase { position: relative; height: 26px; width: 100%; font-weight: 600; font-size: 16px; color: #C9D8F2 }
.carga .frase span { position: absolute; inset: 0; opacity: 0; animation-duration: 3.2s; animation-iteration-count: infinite; animation-timing-function: linear }
.carga .regua { position: relative; width: min(70%, 280px); height: 10px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden }
.carga .regua i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #F5A20A, #FFD27A); border-radius: 6px; animation: k-regua 3.2s infinite linear }
.carga .regua::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 1.5px), rgba(11,31,63,.55) calc(10% - 1.5px), rgba(11,31,63,.55) 10%) }
@media (prefers-reduced-motion: reduce) {
  .carga *, .cena * { animation: none !important }
  .cena .pc { opacity: 1 } .cena .mod, .cena .modf { opacity: 0 }
  .carga .frase span:nth-child(4) { opacity: 1 } .carga .regua i { width: 100% }
